  :root{
    --fs:16px; --fm:32px; --fl:48px;
    --bone:#cfd0d8;
    --ember:#ff8a3d;
    --ember-hot:#ffd27a;
    --blood:#8f2233;
  }
  html,body{
    height:100%;
    margin:0;
    background:#020203;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'CBPixel','Courier New', monospace;
    overflow:hidden;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing:border-box;
  }
  #wrap{
    position:relative;
    width:min(94vw, 1180px);
    aspect-ratio:480/270;
    image-rendering:pixelated;
    box-shadow:0 0 0 4px #000, 0 0 0 7px #1c1420, 0 0 60px 14px rgba(255,138,61,0.12);
  }
  canvas{
    display:block;
    width:100%; height:100%;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    background:#000;
  }
  /* ---- title-style UI: pixel font, ember gradient letters with a 3D extrusion (same look as the CRYPT BRAWL logo) ---- */
  #overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--bone);
    text-align:center;
    background:rgba(3,2,4,0.88);
    font-family:'CBPixel','Courier New',monospace; font-weight:normal; font-synthesis:none;
    letter-spacing:0;
    padding:0 3%;
    box-sizing:border-box;
  }
  #overlay h1{
    font-family:'CBPixelB','CBPixel',monospace; font-weight:normal;
    font-size:var(--fl); line-height:1.05;
    margin:0 0 .22em 0;
    color:transparent; -webkit-text-fill-color:transparent;
    background-image:linear-gradient(#fff3c0 0%,#ffd27a 28%,#ff8a3d 58%,#a8323a 100%);
    -webkit-background-clip:text; background-clip:text;
    filter:drop-shadow(0 .05em 0 #3a0d14) drop-shadow(.05em .1em 0 #3a0d14) drop-shadow(.08em .14em 0 #000) drop-shadow(0 0 .3em rgba(255,138,61,.5));
  }
  #overlay .sub{
    color:var(--bone);
    font-size:var(--fs); line-height:1.65;
    margin-bottom:var(--fs);
    max-width:80%;
  }
  #overlay .sub b{ font-weight:normal; color:var(--ember-hot); }
  #overlay .xpbar{ display:inline-block; width:calc(var(--fs)*7); height:calc(var(--fs)*.6); background:#22161a; border:1px solid #5a3a22; vertical-align:middle; margin-left:.4em; }
  #overlay .xpbar i{ display:block; height:100%; background:#ff8a3d; }
  #overlay .stat{ font-size:var(--fs); color:var(--ember); margin:2px 0; }
  #overlay button{
    --lg:linear-gradient(#ffe9a8 0%,#ffe9a8 28%,#ff8a3d 60%,#a8323a 100%);
    --bx:linear-gradient(rgba(24,15,18,.92),rgba(24,15,18,.92));
    --bd:#5a3a22;
    --ft:drop-shadow(0 .06em 0 #3a0d14) drop-shadow(.06em .12em 0 #000);
    position:relative;
    font-family:'CBPixelB','CBPixel',monospace; font-weight:normal; font-size:var(--fm); line-height:1; letter-spacing:0;
    margin-top:.5em; padding:.45em 1.55em; min-width:6.5em; box-sizing:border-box;
    cursor:pointer; border:2px solid var(--bd); border-radius:0;
    color:transparent; -webkit-text-fill-color:transparent;
    background-color:transparent;
    background-image:var(--lg),var(--bx);
    -webkit-background-clip:text,padding-box; background-clip:text,padding-box;
    filter:var(--ft);
    transition:transform .08s;
  }
  #overlay button::before,#overlay button::after{
    position:absolute; top:50%; transform:translateY(-50%);
    -webkit-text-fill-color:#ffd27a; color:#ffd27a; opacity:0;
  }
  #overlay button::before{ content:'>'; left:.3em; }
  #overlay button::after{ content:'<'; right:.3em; }
  #overlay button:hover,#overlay button:focus-visible{
    outline:none;
    --lg:linear-gradient(#ffffff 0%,#fff3c0 30%,#ffd27a 62%,#ff8a3d 100%);
    --bx:linear-gradient(rgba(74,42,24,.96),rgba(46,26,18,.96));
    --bd:#ff8a3d;
    --ft:drop-shadow(0 .06em 0 #3a0d14) drop-shadow(.06em .12em 0 #000) drop-shadow(0 0 .45em rgba(255,150,70,.75));
  }
  #overlay button:hover::before,#overlay button:hover::after,#overlay button:focus-visible::before,#overlay button:focus-visible::after{ opacity:1; }
  #overlay #ob:has(button:hover) button:not(:hover){
    --lg:linear-gradient(#ffe9a8 0%,#ffe9a8 28%,#ff8a3d 60%,#a8323a 100%);
    --bx:linear-gradient(rgba(24,15,18,.92),rgba(24,15,18,.92));
    --bd:#5a3a22;
    --ft:drop-shadow(0 .06em 0 #3a0d14) drop-shadow(.06em .12em 0 #000);
  }
  #overlay #ob:has(button:hover) button:not(:hover)::before,#overlay #ob:has(button:hover) button:not(:hover)::after{ opacity:0; }
  #overlay button:active{ transform:translateY(.08em); }
  #overlay button:disabled{ opacity:.45; cursor:default; }
  #ob.kb{ max-width:92%; }
  #ob.kb button{ font-size:var(--fs); padding:.3em .6em; margin:.3em .2em 0 !important; }
  #overlay.titlemenu{ background:transparent; justify-content:flex-start; padding-top:31%; animation:tmfade .6s ease-out both; }
  #overlay.titlemenu .sub, #overlay.titlemenu h1{ display:none; }
  #overlay.titlemenu #ob{ display:flex; gap:.5em .6em; flex-wrap:wrap; justify-content:center; }
  #overlay.titlemenu button{ margin:0 !important; }
  #ob.net{ display:flex; flex-direction:column; align-items:center; gap:calc(var(--fs)*.5); width:min(94%,calc(var(--fs)*40)); }
  #ob.net .lab{ font-size:var(--fs); color:var(--ember); margin-top:4px; }
  #ob.net textarea{ width:100%; height:calc(var(--fs)*5.5); box-sizing:border-box; resize:none; font:var(--fs)/1.35 'CBPixel','Courier New',monospace; color:#ffd27a; background:#120c0f; border:2px solid #5a3a22; padding:6px; word-break:break-all; }
  #ob.net textarea:focus{ outline:none; border-color:var(--ember); }
  #ob.net .row{ display:flex; gap:.4em .5em; flex-wrap:wrap; justify-content:center; }
  #ob.net button{ margin:0 !important; font-size:var(--fm); }
  #ob.net .st{ font-size:var(--fs); color:#ffd27a; min-height:calc(var(--fs)*1.6); max-width:94%; line-height:1.6; }
  #ob.net .big{ font-family:'CBPixelB','CBPixel',monospace; font-size:var(--fm); color:#ffd27a; margin:6px 0 2px; text-shadow:2px 2px 0 #000; }
  #ob.net .big.code{ font-size:calc(var(--fl)*1.3); letter-spacing:.3em; color:var(--ember-hot,#ffb347); }
  #ob.net input.codein{ width:calc(var(--fm)*5.4); text-align:center; font:var(--fl) 'CBPixelB','CBPixel',monospace; letter-spacing:.2em; color:#ffd27a; background:#120c0f; border:2px solid #5a3a22; padding:6px 4px 6px 12px; text-transform:uppercase; }
  #ob.net input.codein:focus{ outline:none; border-color:var(--ember); }
  #ob.net input.txtin{ width:calc(var(--fm)*12); max-width:90%; box-sizing:border-box; font:var(--fm) 'CBPixel','Courier New',monospace; color:#ffd27a; background:#120c0f; border:2px solid #5a3a22; padding:.25em .4em; }
  #ob.net input.txtin:focus{ outline:none; border-color:var(--ember); }
  #ob.net input.txtin::placeholder{ color:#6a5a52; }
  #ob.net .lb{ font:var(--fs)/1.6 'CBPixel','Courier New',monospace; color:#ffd27a; text-align:left; white-space:pre; background:#120c0f; border:2px solid #5a3a22; padding:8px 14px; min-width:calc(var(--fs)*24); }
  .hidden{ display:none !important; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="270"></canvas>
  <div id="overlay"><h1 id="ot"></h1><div class="sub" id="os"></div><div id="ob"></div></div>
</div>
<script>
(() => {
"use strict";
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = canvas.width, H = canvas.height;

const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
function uiScale(){const w=document.getElementById('wrap').clientWidth||480,p=Math.max(1,Math.round(w/480)),r=document.documentElement.style;r.setProperty('--fs',(p>=2?8*p:12)+'px');r.setProperty('--fm',(p>=2?12*p:14)+'px');r.setProperty('--fl',24*p+'px')}
addEventListener('resize',uiScale);uiScale();try{document.fonts.load('16px CBPixel');document.fonts.load('16px CBPixelB')}catch(e){}


// ---------- utility ----------
const rand = (a,b) => a + Math.random()*(b-a);
const randi = (a,b) => Math.floor(rand(a,b+1));
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const dist = (x1,y1,x2,y2) => Math.hypot(x2-x1,y2-y1);
function aabb(ax,ay,aw,ah,bx,by,bw,bh){
  return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
}
function circleRect(cx,cy,cr,rx,ry,rw,rh){
  const nx = clamp(cx, rx, rx+rw);
  const ny = clamp(cy, ry, ry+rh);
  return dist(cx,cy,nx,ny) < cr;
}
function shadeBase(hex, mul){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  r=clamp(Math.round(r*mul),0,255); g=clamp(Math.round(g*mul),0,255); b=clamp(Math.round(b*mul),0,255);
  return `rgb(${r},${g},${b})`;
}

// ---------- input ----------
const keys = {};
window.addEventListener('keydown', e=>{
  keys[e.code]=true;

const mouse = {x:W/2, y:H/2, down:false};
canvas.addEventListener('mousemove', e=>{
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX-r.left) * (W/r.width);
  mouse.y = (e.clientY-r.top) * (H/r.height);
});
canvas.addEventListener('mousedown', e=>{ mouse.down = true; e.preventDefault();});

// ---------- offscreen static background (base stone, cool tone) ----------
const bg = document.createElement('canvas');
bg.width = W; bg.height = H;
const bctx = bg.getContext('2d');

function drawBrickField(c, x0,y0,w,h, base, mortar, seedOffset, crackChance){
  c.save();
  c.beginPath(); c.rect(x0,y0,w,h); c.clip();
  c.fillStyle = mortar;
  c.fillRect(x0,y0,w,h);
  const bw=10, bh=6;
  let row=0;
  for(let y=y0-bh; y<y0+h+bh; y+=bh){
    const offset = (row%2===0)?0:bw/2;
    for(let x=x0-bw; x<x0+w+bw; x+=bw){
      const hashed = Math.sin((x+offset)*12.9898 + y*78.233 + seedOffset)*43758.5453;
      const shade = hashed - Math.floor(hashed);
      const shadeAdj = 1 + (shade-0.5)*0.4;
      c.fillStyle = shadeBase(base, shadeAdj);
      c.fillRect(Math.floor(x+offset)+0.5, y+0.5, bw-1, bh-1);
    }
    row++;
  }
  // jagged cracks + rune scratches
  if(crackChance){
    for(let i=0;i<Math.floor(w*h*crackChance/900);i++){
      const cx = rand(x0,x0+w), cy = rand(y0,y0+h);
      c.strokeStyle = 'rgba(5,6,14,0.55)';
      c.lineWidth = 1;
      c.beginPath();
      c.moveTo(cx,cy);
      let px=cx,py=cy;
      const segs = randi(2,4);
      for(let s=0;s<segs;s++){
        px += rand(-6,6); py += rand(-4,4);
        c.lineTo(px,py);
      }
      c.stroke();
    }
  }
  c.restore();
}

function drawRune(c,x,y,scale){
  c.strokeStyle='rgba(70,50,90,0.55)';
  c.lineWidth=1;
  c.save();
  c.translate(x,y); c.scale(scale,scale);
  c.beginPath();
  c.moveTo(0,-6); c.lineTo(0,6);
  c.moveTo(-5,-2); c.lineTo(5,-2);
  c.moveTo(-4,4); c.lineTo(0,-1); c.lineTo(4,4);
  c.stroke();
  c.restore();
}

function drawCobweb(c,x,y,flip){
  c.save();
  c.translate(x,y);
  c.scale(flip,1);
  c.strokeStyle='rgba(180,185,200,0.28)';
  c.lineWidth=1;
  const R=22;
  for(let i=0;i<=4;i++){
    const ang = (Math.PI/2) * (i/4);
    c.beginPath(); c.moveTo(0,0); c.lineTo(Math.cos(ang)*R, Math.sin(ang)*R); c.stroke();
  }
  for(let r=6;r<=R;r+=6){
    c.beginPath();
    c.arc(0,0,r, 0, Math.PI/2);
    c.stroke();
  }
  c.restore();
}

function drawBarrelStatic(c,x,y){
  c.fillStyle='#1a1210';
  c.fillRect(x-1,y+14,18,3);
  c.fillStyle='#3f2a1a';
  c.fillRect(x,y,16,16);
  c.fillStyle='#2c1c10';
  c.fillRect(x,y+2,16,2);
  c.fillRect(x,y+11,16,2);
  c.fillStyle='#523420';
  c.fillRect(x+2,y+4,12,6);
  c.fillStyle='#1a1210';
  for(let i=0;i<4;i++) c.fillRect(x+2+i*4, y, 1, 16);
}

function buildBackground(){
  // deep cool base
  bctx.fillStyle = '#07070c';
  bctx.fillRect(0,0,W,H);
  // main wall: cool dark slate
  drawBrickField(bctx, 0,0,W,H, '#232434', '#0a0a12', 1, 0.9);
  // niches: brick-red recessed alcoves
  for(const n of niches){
    drawBrickField(bctx, n.x, n.y, n.w, n.h, '#3a1720', '#150609', 40+n.x, 0.6);
    // top shadow lip
    bctx.fillStyle='rgba(0,0,0,0.6)';
    bctx.fillRect(n.x, n.y+n.h-4, n.w, 4);
    bctx.strokeStyle='rgba(0,0,0,0.7)';
    bctx.lineWidth=3;
    bctx.strokeRect(n.x+1.5,n.y-4,n.w-3,n.h+4);
  }
  // rune carvings scattered on main wall
  for(let i=0;i<10;i++){
    drawRune(bctx, rand(20,W-20), rand(10,H-70), rand(0.7,1.1));
  }
  // cobwebs
  for(const cw of cobwebs) drawCobweb(bctx, cw.x, cw.y, cw.flip);

  // platforms (stone slabs, cool tone)
  for(const p of platforms){
    if(p.big){
      drawBrickField(bctx, p.x, p.y, p.w, p.h, '#2a2b3d', '#0c0c14', 5, 1.1);
      bctx.fillStyle = 'rgba(0,0,0,0.55)';
      bctx.fillRect(p.x, p.y, p.w, 3);
      // rubble specks
      for(let i=0;i<40;i++){
        bctx.fillStyle = Math.random()<0.5 ? 'rgba(90,70,60,0.25)':'rgba(20,20,30,0.4)';
        bctx.fillRect(rand(p.x,p.x+p.w), rand(p.y+4,p.y+p.h-4), randi(1,2), randi(1,2));
      }
    } else {
      drawBrickField(bctx, p.x, p.y, p.w, p.h, '#33344a', '#0e0e18', 9, 0.5);
      bctx.fillStyle = '#484a68';
      bctx.fillRect(p.x, p.y, p.w, 2);
      bctx.fillStyle = '#050508';
      bctx.fillRect(p.x, p.y+p.h-1, p.w, 1);
    }
  }
  // side walls (darker still, frame the room)
  drawBrickField(bctx, 0,0,8,H, '#181924','#08080e', 20, 0);
  drawBrickField(bctx, W-8,0,8,H, '#181924','#08080e', 30, 0);

  // barrels clutter
  for(const b of barrels) drawBarrelStatic(bctx, b.x, b.y);

  // wall sconce frames behind each torch (stone bracket)
  for(const t of torches){
    if(t.shrine){
      bctx.fillStyle='#1a0d10';
      bctx.fillRect(t.x-16, t.y-6, 32, 10);
      bctx.fillStyle='#3a2418';
      bctx.fillRect(t.x-14, t.y-4, 28, 6);
    } else {
      bctx.fillStyle='#211722';
      bctx.fillRect(t.x-4, t.y-2, 8, 10);
    }
  }

  // ambient overall darkening vignette baked in (will be re-lit by dynamic glow layer)
  const vg = bctx.createRadialGradient(W/2,H*0.55,30, W/2,H*0.55, W*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.6)');
  bctx.fillStyle = vg;
  bctx.fillRect(0,0,W,H);
}
buildBackground();

// ---------- particles ----------
let particles = [];
function spawnParticle(p){ particles.push(p); }
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
    p.vy += (p.grav||0)*dt;
    if(p.life<=0) particles.splice(i,1);
  }
}
function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha = clamp(p.life/p.maxLife,0,1);
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
  }
  ctx.globalAlpha = 1;
}
function torchFlicker(dt){
  for(const t of litTorches()){
    if(Math.random()<0.7){
      spawnParticle({
        x:t.x+rand(-1,1), y:t.y-2, vx:rand(-3,3), vy:rand(-26,-14),
        life:rand(0.25,0.5), maxLife:0.5, grav:-8, size:randi(1,2),
        color: Math.random()<0.5 ? '#ff8a3d' : '#ffd27a'
      });
    }
  }
}

// ---------- dynamic torch light (drawn every frame, 'lighter' blend) ----------
function drawTorchLight(){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(const t of litTorches()){
    const flick = 0.85 + Math.sin(performance.now()/70 + t.x)*0.1 + Math.random()*0.06;
    const R = (t.shrine? 95 : 62) * flick;
    const grad = ctx.createRadialGradient(t.x, t.y, 1, t.x, t.y, R);
    grad.addColorStop(0, 'rgba(255,210,140,0.55)');
    grad.addColorStop(0.25, 'rgba(255,140,60,0.28)');
    grad.addColorStop(1, 'rgba(255,90,30,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(t.x-R,t.y-R,R*2,R*2);
  }
  // red gem pulse
  if(litTorches().length<torches.length){ctx.restore();return;}
  const pulse = 0.7+Math.sin(performance.now()/220)*0.3;
  const g2 = ctx.createRadialGradient(redGem.x,redGem.y,1, redGem.x,redGem.y, 26*pulse);
  g2.addColorStop(0,'rgba(255,50,60,0.5)');
  g2.addColorStop(1,'rgba(255,0,20,0)');
  ctx.fillStyle=g2;
  ctx.fillRect(redGem.x-26,redGem.y-26,52,52);
  ctx.restore();
}

function drawTorchFlames(){
  for(const t of litTorches()){
    const h = t.shrine? 10:7;
    const w = t.shrine? 6:4;
    const wob = Math.sin(performance.now()/60 + t.x)*1.2;
    ctx.fillStyle='#2a1608';
    ctx.fillRect(t.x-w/2, t.y-2, w, 4);
    ctx.fillStyle = '#ff5b1f';
    ctx.beginPath();
    ctx.moveTo(t.x-w/2, t.y-2);
    ctx.lineTo(t.x+wob, t.y-2-h);
    ctx.lineTo(t.x+w/2, t.y-2);
    ctx.fill();
    ctx.fillStyle='#ffd27a';
    ctx.beginPath();
    ctx.moveTo(t.x-w/4, t.y-2);
    ctx.lineTo(t.x+wob*0.6, t.y-2-h*0.55);
    ctx.lineTo(t.x+w/4, t.y-2);
    ctx.fill();
  }
  // chains near shrine
  for(const c of chains){
    ctx.strokeStyle='rgba(30,30,36,0.8)';
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(c.x,c.y);
    const sway = Math.sin(performance.now()/900 + c.x)*3;
    ctx.lineTo(c.x+sway, c.y+c.len);
    ctx.stroke();
  }
}

function drawKnight(p){
  const x=p.x, y=p.y, w=p.w, h=p.h, facing=p.facing;
  const grounded = p.onGround;
  const moving = Math.abs(p.vx) > 4;
  const t = p.animT;
  ctx.save();
  if(p.invuln>0) ctx.globalAlpha = 0.5 + 0.5*Math.sin(performance.now()/40);

  ctx.translate(Math.round(x+w/2), Math.round(y+h));
  ctx.scale(facing,1);

  // ground shadow
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.ellipse(0,0,w*0.5,2,0,0,Math.PI*2); ctx.fill();

  let legA=0, legB=0, armSwing=0, bodyBob=0, crouch=0;
  if(!grounded){
    if(p.vy<0){ legA=-3; legB=3; armSwing=-1; crouch=1; } // rising: legs tucked
    else { legA=4; legB=-2; armSwing=1; crouch=-1; }       // falling: legs extended
  } else if(moving){
    legA = Math.sin(t)*4;
    legB = Math.sin(t+Math.PI)*4;
    armSwing = Math.sin(t+Math.PI)*2;
    bodyBob = Math.abs(Math.sin(t))*1;
  } else {
    bodyBob = Math.sin(t*0.5)*0.6;
  }

  const bodyTop = -h+2-bodyBob-crouch;
  // legs (dark steel greaves)
  ctx.fillStyle = '#3a3d4a';
  ctx.fillRect(-3, -6+legA*0.3, 3, 6-legA*0.3);
  ctx.fillRect(1, -6+legB*0.3, 3, 6-legB*0.3);
  ctx.fillStyle = '#22232c';
  ctx.fillRect(-3, -2, 3, 2);
  ctx.fillRect(1, -2, 3, 2);

  // torso (armor)
  ctx.fillStyle = p.c.armor;
  ctx.fillRect(-4, bodyTop+6, 8, h-8);
  ctx.fillStyle = '#5c6072';
  ctx.fillRect(-4, bodyTop+6, 8, 2);
  // chest emblem glow
  ctx.fillStyle = p.c.glow;
  ctx.fillRect(-1, bodyTop+10, 2, 2);

  // cape
  ctx.fillStyle = p.c.cape;
  const capeSway = Math.sin(t*0.7)*2 + (!grounded? -crouch*2:0);
  ctx.beginPath();
  ctx.moveTo(-4, bodyTop+7);
  ctx.lineTo(-6+capeSway, bodyTop+h-2);
  ctx.lineTo(-3, bodyTop+h-4);
  ctx.fill();

  // arm + weapon (glowing runic blade pointed forward)
  ctx.fillStyle = p.c.armor;
  ctx.fillRect(3, bodyTop+8+armSwing*0.4, 3, 6);
  ctx.strokeStyle = '#bcePorary'; // placeholder unused
  ctx.fillStyle = '#dfe6ff';
  if(!p.sw)ctx.fillRect(6, bodyTop+6+armSwing*0.4, 7, 2);
  ctx.fillStyle = p.c.blade;
  if(!p.sw)ctx.fillRect(12, bodyTop+6+armSwing*0.4, 2, 2);

  // helmet
  ctx.fillStyle = '#565a6c';
  ctx.fillRect(-4, bodyTop-6, 8, 7);
  ctx.fillStyle = '#22232c';
  ctx.fillRect(-4, bodyTop-3, 8, 2); // visor slit
  ctx.fillStyle = p.c.glow;
  ctx.fillRect(1, bodyTop-3, 2, 1); // eye glow
  ctx.fillStyle = '#7a3020';
  ctx.fillRect(-1, bodyTop-8, 2, 3); // plume
  ctx.restore();
}

// ===================== ONLINE: peer-to-peer lockstep over WebRTC =====================
// No server: the two players swap one short code each (host -> guest, guest -> host).
// Both machines run the same deterministic sim and exchange only inputs (key bits + mouse position) every frame.
// Every 30 frames the machines compare a state hash; if they ever differ, the host sends a full snapshot.
const NET={on:false,role:'',li:0,ri:1,pc:null,gc:null,cc:null,rtt:0,D:4,mid:0,fr:0,gen:0,ack:-1,rack:-1,
 inL:new Map(),inR:new Map(),hs:new Map(),rh:new Map(),early:[],rmL:false,rmR:false,stall:0,resyncs:0,lastRq:0,pingT:0,ui:null,lostShown:false};
const NET_ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'}];
const NET_DEC=new TextDecoder(),NET_ENC=new TextEncoder();
const b64e=u8=>{let s='';for(let i=0;i<u8.length;i++)s+=String.fromCharCode(u8[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const b64d=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u};
async function netPipe(u8,Ctor){const st=new Blob([u8]).stream().pipeThrough(new Ctor('deflate-raw'));return new Uint8Array(await new Response(st).arrayBuffer())}
async function netPack(obj){const raw=NET_ENC.encode(JSON.stringify(obj));return window.CompressionStream?'z'+b64e(await netPipe(raw,CompressionStream)):'r'+b64e(raw)}
async function netUnpack(str){
 try{str=String(str).trim().replace(/\s+/g,'');if(!str)throw 0;
  const t=str[0],u=b64d(str.slice(1));let raw=u;
  if(t==='z'){if(!window.DecompressionStream)throw new Error('This browser cannot read the code');raw=await netPipe(u,DecompressionStream)}else if(t!=='r')throw 0;
  const o=JSON.parse(NET_DEC.decode(raw));if(!o||typeof o.s!=='string')throw 0;return o}
 catch(e){throw new Error(e&&e.message&&/browser/.test(e.message)?e.message:'that does not look like a valid code. Copy the whole thing.')}}
function netSend(o){if(NET.cc&&NET.cc.readyState==='open')try{NET.cc.send(JSON.stringify(o))}catch(e){}}
function netTeardown(){
 const N=NET;clearInterval(N.pingT);
 [N.gc,N.cc].forEach(c=>{if(c){c.onopen=c.onclose=c.onmessage=null;try{c.close()}catch(e){}}});
 if(N.pc){N.pc.onconnectionstatechange=null;try{N.pc.close()}catch(e){}}
 N.gc=N.cc=N.pc=null;N.on=false;N.rtt=0;N.early=[];N.rmL=N.rmR=false;N.stall=0;N.mid=0;N.lostShown=false;N.ui=null}
function netClose(){netSend({t:'bye'});const pc=NET.pc;setTimeout(()=>{if(NET.pc===pc)netTeardown()},120);NET.on=false;mode=1}
function netPeer(role){
 const ui=NET.ui;netTeardown();NET.ui=ui;const N=NET;N.role=role;N.li=role==='host'?0:1;N.ri=1-N.li;
 const pc=new RTCPeerConnection({iceServers:NET_ICE});N.pc=pc;
 N.gc=pc.createDataChannel('g',{negotiated:true,id:0,ordered:false,maxRetransmits:0});   // inputs: fast, loss tolerated (sent redundantly)
 N.cc=pc.createDataChannel('c',{negotiated:true,id:1});                                   // control: reliable
 N.gc.onmessage=e=>netGame(e.data);
 N.cc.onmessage=e=>{try{netCtl(JSON.parse(e.data))}catch(err){console.error(err)}};
 N.cc.onopen=()=>{if(NET.pc===pc)netOpen()};
 N.cc.onclose=()=>{if(NET.pc===pc)netLost('The connection to your opponent was lost.')};
 pc.onconnectionstatechange=()=>{if(NET.pc!==pc)return;const s=pc.connectionState;
  if(s==='connecting'&&N.ui)N.ui('Connecting…');
  if(s==='failed'||s==='closed')netLost(N.on?'The connection to your opponent was lost.':'Could not connect. Check the codes, or a strict firewall/VPN may be blocking peer-to-peer.')};
 return pc}
function netGathered(pc){return new Promise(res=>{if(pc.iceGatheringState==='complete')return res();
 const t=setTimeout(res,4000);pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete'){clearTimeout(t);res()}})})}
async function netMakeOffer(){const pc=netPeer('host');await pc.setLocalDescription(await pc.createOffer());await netGathered(pc);return netPack({t:'o',s:pc.localDescription.sdp})}

 const pc=netPeer('guest');await pc.setRemoteDescription({type:'offer',sdp:o.s});await pc.setLocalDescription(await pc.createAnswer());await netGathered(pc);return netPack({t:'a',s:pc.localDescription.sdp})}

 const N=NET;if(N.on)return;N.on=true;N.lostShown=false;N.ui=null;mode=3;N.match=MM.match||'';N.opp=MM.opp||null;

 const N=NET;

// ---- control messages ----
function netCtl(m){
 const N=NET;
 switch(m.t){
  case 'ping':netSend({t:'pong',n:m.n});break;
  case 'pong':{const s=performance.now()-m.n;N.rtt=N.rtt?N.rtt*.7+s*.3:s;break}
  case 'bye':netLost('Your opponent left the match.');break;
  case 'sel':sel[N.ri]=m.c;lock[N.ri]=!!m.l;if(N.role==='host'&&scene==='select'&&lock[0]&&lock[1])netGo();break;
  case 'go':if(N.role==='guest'&&scene==='select'){N.D=m.D;sel=[m.s[0],m.s[1]];lock=[true,true];startVs()}break;
  case 'rm':N.rmR=true;netRematchCheck();break;
  case 'cs':if(scene==='victory'||scene==='fight'){victoryMenu=false;overlay.classList.add('hidden');toSelect(3)}break;
  case 'h':if(m.m!==N.mid)break;N.rh.set(m.f,m.h);netCheck(m.f);break;
  case 'rq':if(m.m===N.mid&&N.role==='host'&&scene==='fight')netSend({t:'sn',m:N.mid,f:N.fr-1,s:S});break;
  case 'sn':netApplySnapshot(m);break}}
function netSelSend(){netSend({t:'sel',c:sel[NET.li],l:lock[NET.li]?1:0})}
function netGo(){
 const N=NET;if(scene!=='select'||N.role!=='host')return;
 N.D=clamp(Math.ceil(N.rtt/2/16.7)+2,3,10);
 netSend({t:'go',D:N.D,s:[sel[0],sel[1]]});startVs()}
function netRematch(){NET.rmL=true;VB_LABELS[0]='WAITING…';netSend({t:'rm'});netRematchCheck()}
function netRematchCheck(){const N=NET;if(N.rmL&&N.rmR){N.rmL=N.rmR=false;victoryMenu=false;newMatch()}}
// ---- the lockstep itself ----
function netMatchInit(){
 const N=NET;N.mid++;N.fr=0;N.inL.clear();N.inR.clear();N.hs.clear();N.rh.clear();
 for(let f=0;f<N.D;f++){N.inL.set(f,0);N.inR.set(f,0)}
 N.gen=N.D-1;N.ack=N.D-1;N.rack=N.D-1;N.rmL=N.rmR=false;N.stall=0;VB_LABELS[0]='REMATCH';
 const ea=N.early;N.early=[];ea.forEach(netGame)}
function netGame(data){
 const N=NET;let m;try{m=JSON.parse(data)}catch(e){return}
 if(m.m>N.mid){N.early.push(data);if(N.early.length>400)N.early.shift();return}
 if(m.m<N.mid)return;
 m.i.forEach((v,k)=>{const f=m.f+k;if(f>=N.fr-240&&!N.inR.has(f))N.inR.set(f,v)});
 while(N.inR.has(N.ack+1))N.ack++;
 if(m.a>N.rack)N.rack=m.a}
function netSendInputs(){
 const N=NET;if(!N.gc||N.gc.readyState!=='open')return;
 const from=Math.max(N.rack+1,N.gen-40),arr=[];for(let f=from;f<=N.gen;f++)arr.push(N.inL.get(f)||0);
 if(arr.length)try{N.gc.send(JSON.stringify({m:N.mid,a:N.ack,f:from,i:arr}))}catch(e){}}
function netHash(s){
 let h=2166136261;const mx=v=>{h^=(Math.round((v||0)*64)|0);h=Math.imul(h,16777619)};
 s.p.forEach(p=>{mx(p.x);mx(p.y);mx(p.vx);mx(p.vy);mx(p.dmg);mx(p.stocks);mx(p.stun);mx(p.ch);mx(p.jumps)});
 mx(s.pr.length);mx(s.fc);return h>>>0}
function netCheck(f){
 const N=NET,a=N.hs.get(f),b=N.rh.get(f);if(a===undefined||b===undefined)return;
 N.hs.delete(f);N.rh.delete(f);
 if(a!==b&&N.role==='guest'&&performance.now()-N.lastRq>800){N.lastRq=performance.now();N.resyncs++;netSend({t:'rq',m:N.mid})}}
function netAfter(f){
 const N=NET;if(((f+1)%30)!==0)return;
 const h=netHash(S);N.hs.set(f,h);netSend({t:'h',m:N.mid,f,h});netCheck(f)}
function netInputs(f){const a=[0,0];a[NET.li]=NET.inL.get(f)||0;a[NET.ri]=NET.inR.get(f)||0;return a}
function netStep(){
 const N=NET;if(!N.on)return false;
 while(N.gen<N.fr+N.D){N.gen++;N.inL.set(N.gen,read(0))}
 netSendInputs();
 if(!N.inR.has(N.fr)){if(++N.stall>900)netLost('The connection timed out.');return false}
 N.stall=0;
 step(S,netInputs(N.fr));netAfter(N.fr);N.fr++;
 if((N.fr&127)===0)for(const mp of [N.inL,N.inR])for(const k of mp.keys())if(k<N.fr-240)mp.delete(k);
 return true}
function netApplySnapshot(m){
 const N=NET;if(m.m!==N.mid||scene!=='fight')return;
 const cur=N.fr;if(m.f+1<cur-200)return;
 for(const k of [...N.hs.keys()])if(k>m.f)N.hs.delete(k);
 S=m.s;N.fr=m.f+1;
 while(N.fr<cur&&N.inL.has(N.fr)&&N.inR.has(N.fr)){step(S,netInputs(N.fr));netAfter(N.fr);N.fr++}}
function netHud(){

 if(scene==='fight'&&N.stall>20)txt('WAITING FOR OPPONENT…',W/2,70,10,'#ffd27a');

function mmNorm(u){u=String(u||'').trim().replace(/\/+$/,'');if(!u)return'';if(!/^https?:\/\//i.test(u))u=(/^(localhost|127\.|10\.|192\.168\.|\[::1\])/i.test(u)?'http://':'https://')+u;return u}

async function mmHttp(base,path,body,method){
 const c=new AbortController(),to=setTimeout(()=>c.abort(),8000);
 try{const r=await fetch(base+path,method==='GET'?{signal:c.signal}:{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body||{}),signal:c.signal});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||('Server error '+r.status)),{status:r.status});return j}
 catch(e){if(e.name==='AbortError')throw new Error('The server did not answer.');if(e instanceof TypeError)throw new Error('Could not reach the server.');throw e}
 finally{clearTimeout(to)}}

// ---- searching / hosting / joining ----
async function mmSearch(kind,code,keepTries){
 mmStop(true);netTeardown();
 if(!keepTries)MM.tries=0;
 MM.kind=kind;MM.code=code||'';MM.t0=Date.now();MM.live=true;MM.phase='search';MM.role='';MM.n=MM.online=0;MM.match='';MM.opp=null;MM.oppTxt='';MM.win=0;if(kind!=='mm')MM.ranked=false;
 mmShow();
 try{
  const j=await mmPost('/ticket',{mode:kind,code,ranked:kind==='mm'&&!!MM.ranked,token:kind==='mm'&&MM.ranked?ACC.token:undefined});
  MM.id=j.id;if(j.code)MM.code=j.code;mmRender();
  const es=new EventSource(mmUrl()+'/events?id='+encodeURIComponent(MM.id));MM.es=es;
  es.onmessage=e=>{try{mmEvent(JSON.parse(e.data))}catch(err){console.error(err)}};
  MM.errSince=0;es.onopen=()=>{MM.errSince=0};
  es.onerror=()=>{ // the browser retries by itself; give up if the server stays unreachable
   if(MM.es!==es||NET.on)return;
   const dead=es.readyState===2||(MM.errSince&&Date.now()-MM.errSince>9000);
   if(!MM.errSince)MM.errSince=Date.now();
   if(dead)mmProblem('Lost contact with the matchmaking server.',()=>mmSearch(kind,code))}}
 catch(e){
  if(e.status===401){mmStop(false);accOut();return accAuth('login','Your login expired. Please sign in again.',()=>playMenu())}
   if(kind==='join'&&e.status===404){mmStop(false);return mmJoinPanel(e.message)}
  mmProblem(e.message+' Check the address under SERVER SETTINGS.',()=>mmSearch(kind,code))}}
function mmEvent(m){
 switch(m.t){
  case 'q':MM.n=m.n;MM.online=m.online;MM.win=m.w||0;MM.rating=m.r||0;MM.power=m.p||0;mmRender();break;
  case 'matched':mmMatched(m.role,m);break;
  case 'sig':mmSignal(m.d);break;
  case 'left':if(!NET.on)mmRetry('Your opponent left before the match started.');break;
  case 'error':mmProblem(m.m||'The server closed this lobby.');break}}
async function mmMatched(role,m){
 if(NET.on)return;
 m=m||{};MM.match=m.match||'';MM.opp=m.opp||null;MM.oppTxt=m.opp?('vs '+m.opp.name+' · LV '+(m.opp.level||1)+' ('+m.opp.rating+')'):'';
 MM.role=role;MM.phase='found';if(MM.els)MM.els.msg='Connecting…';mmRender();
 NET.ui=(t,bad)=>{if(bad)mmRetry(t);else if(MM.els){MM.els.msg=t;mmRender()}};
 clearTimeout(MM.hs);MM.hs=setTimeout(()=>{if(!NET.on)mmRetry('The connection to your opponent timed out.')},MM.hsMs);
 if(role==='host'){try{const c=await netMakeOffer();mmSig({t:'offer',c})}catch(e){mmRetry(e.message)}}}
async function mmSignal(d){
 try{
  if(MM.role==='guest'&&d&&d.t==='offer'){const c=await netAcceptOffer(d.c);mmSig({t:'answer',c})}
  else if(MM.role==='host'&&d&&d.t==='answer')await netAcceptAnswer(d.c)}
 catch(e){mmRetry('The handshake with your opponent failed.')}}
// a match attempt fell through: random matchmaking quietly searches again, private servers tell you
function mmRetry(msg){
 if(NET.on||!MM.live&&!MM.id)return;
 const kind=MM.kind;clearTimeout(MM.hs);
 if(kind==='mm'&&MM.tries<5){MM.tries++;mmSearch('mm','',true);if(MM.els){MM.els.msg=msg+' Searching again…';mmRender()}return}
 if(kind==='create'&&MM.tries<5){MM.tries++;mmSearch('create','',true);if(MM.els){MM.els.msg=msg+' New code ready.';mmRender()}return}
 mmProblem(msg,kind==='mm'?()=>mmSearch('mm'):null)}

// ===================== ACCOUNTS + RANKED =====================
// Accounts live on the matchmaker server (username + password). Signed-in players can play ranked: the server pairs
// them by rating, both players report the result after the match, and the server updates the ratings.
const ACC={name:'',token:'',rating:0,games:0,wins:0,losses:0,rank:0,level:1,xp:0,xpCur:0,xpNext:100,mood:'NEW',power:0,res:null};
try{const a=JSON.parse(localStorage.getItem('cb_acc')||'null');if(a&&a.token&&a.name)Object.assign(ACC,{name:String(a.name),token:String(a.token),rating:a.rating|0,games:a.games|0,wins:a.wins|0,losses:a.losses|0,level:a.level|0||1,xp:a.xp|0,xpCur:a.xpCur|0,xpNext:a.xpNext|0||100,mood:String(a.mood||'NEW'),power:a.power|0})}catch(e){}
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function accSave(){try{if(ACC.token)localStorage.setItem('cb_acc',JSON.stringify({name:ACC.name,token:ACC.token,rating:ACC.rating,games:ACC.games,wins:ACC.wins,losses:ACC.losses,level:ACC.level,xp:ACC.xp,xpCur:ACC.xpCur,xpNext:ACC.xpNext,mood:ACC.mood,power:ACC.power}));else localStorage.removeItem('cb_acc')}catch(e){}}
function accProfile(p){if(!p)return;ACC.name=p.name;ACC.rating=p.rating;ACC.games=p.games;ACC.wins=p.wins;ACC.losses=p.losses;if(p.rank!==undefined)ACC.rank=p.rank;if(p.level){ACC.level=p.level;ACC.xp=p.xp;ACC.xpCur=p.xpCur;ACC.xpNext=p.xpNext;ACC.mood=p.mood;ACC.power=p.power}accSave()}
function accOut(){ACC.name=ACC.token='';ACC.rating=ACC.games=ACC.wins=ACC.losses=ACC.rank=ACC.xp=ACC.xpCur=ACC.power=0;ACC.level=1;ACC.xpNext=100;ACC.mood='NEW';ACC.res=null;accSave()}
async function accRefresh(){if(!ACC.token||!mmUrl())return;try{const j=await mmPost('/me',{token:ACC.token});accProfile(j.profile)}catch(e){if(e&&e.status===401)accOut()}}
function accLine(){return ACC.token?'Signed in as <b>'+esc(ACC.name)+'</b> · LV '+ACC.level+' · rating '+ACC.rating:'Play against people online.<br>Make an account to play ranked.'}
function accInfo(){
 const span=Math.max(1,ACC.xpNext-ACC.xpCur),pct=Math.max(0,Math.min(100,Math.round((ACC.xp-ACC.xpCur)/span*100)));
 return 'Signed in as <b>'+esc(ACC.name)+'</b><br>Level <b>'+ACC.level+'</b> · XP '+ACC.xp+' / '+ACC.xpNext+' <span class="xpbar"><i style="width:'+pct+'%"></i></span><br>Rating <b>'+ACC.rating+'</b> · '+ACC.wins+' wins · '+ACC.losses+' losses'+(ACC.rank?' · rank #'+ACC.rank:'')+'<br>Mood <b>'+esc(ACC.mood)+'</b> · Match power <b>'+ACC.power+'</b>'}
function accGate(next){if(ACC.token)next();else accAuth('login','Sign in to play ranked matches.',next)}
function accMenu(){
 mmStop(true);netTeardown();
 if(ACC.token){
  showOv('ACCOUNT',accInfo(),[['LEADERBOARD',()=>lbPanel()],['SIGN OUT',()=>{accOut();accMenu()}],['BACK',()=>playMenu()]]);
  accRefresh().then(()=>{if(ACC.token&&document.getElementById('ot').textContent==='ACCOUNT')document.getElementById('os').innerHTML=accInfo()})}
 else showOv('ACCOUNT','Make an account to play ranked and get on the leaderboard.<br>No email or real name needed.',[['SIGN IN',()=>accAuth('login','')],['CREATE ACCOUNT',()=>accAuth('register','')],['LEADERBOARD',()=>lbPanel()],['BACK',()=>playMenu()]])}
function accAuth(kind,msg,next){
 mmStop(true);netTeardown();
 const create=kind==='register';
 const field=(ph,pass,ac)=>{const e=netEl('input');e.className='txtin';if(pass)e.type='password';e.maxLength=pass?64:16;e.placeholder=ph;e.spellcheck=false;e.autocomplete=ac;['keydown','keyup'].forEach(ev=>e.addEventListener(ev,x=>x.stopPropagation()));return e};
 const nm=field('Username',false,'username'),pw=field('Password',true,create?'new-password':'current-password'),pw2=create?field('Repeat password',true,'new-password'):null;
 const st=netEl('div','st',msg||'');st.style.color='#ffd27a';
 const go=netBtn(create?'CREATE ACCOUNT':'SIGN IN',async()=>{
  const name=nm.value.trim();
  if(!name||!pw.value){st.style.color='#ff8a6a';st.textContent='Enter a name and a password.';return}
  if(create&&pw.value!==pw2.value){st.style.color='#ff8a6a';st.textContent='The two passwords do not match.';return}
  go.disabled=true;st.style.color='#ffd27a';st.textContent=create?'Creating your account…':'Signing in…';
  try{const j=await mmPost(create?'/register':'/login',{name,pass:pw.value});ACC.token=j.token;accProfile(j.profile);ACC.res=null;if(next)next();else accMenu()}
  catch(e){st.style.color='#ff8a6a';st.textContent=e.message;go.disabled=false}});
 [nm,pw,pw2].forEach(e=>{if(e)e.onkeydown=ev=>{ev.stopPropagation();if(ev.key==='Enter')go.click()}});
 const row=netEl('div','row');row.append(go,netBtn(create?'I HAVE AN ACCOUNT':'NEW ACCOUNT',()=>accAuth(create?'login':'register','',next)),netBtn('BACK',()=>next?playMenu():accMenu()));
 netPanel(create?'CREATE ACCOUNT':'SIGN IN',create?'Pick a username and a password.<br>No email or real name needed. There is no password reset, so remember it.':'Welcome back.',[nm,pw].concat(pw2?[pw2]:[],[row,st]));
 setTimeout(()=>{const a=document.activeElement;if(!a||a===document.body||a.tagName==='BUTTON')nm.focus()},50)}
async function lbPanel(){
 mmStop(true);netTeardown();
 const box=netEl('div','lb','Loading…');
 netPanel('LEADERBOARD','Top ranked players',[box,(()=>{const r=netEl('div','row');r.append(netBtn('BACK',()=>ACC.token?accMenu():playMenu()));return r})()]);
 try{const j=await mmHttp(mmUrl(),'/leaderboard',null,'GET');
  box.textContent=j.top.length?j.top.map((q,i)=>String(i+1).padStart(2)+'. '+q.name.padEnd(16)+' LV'+String(q.level||1).padStart(2)+' '+String(q.rating).padStart(5)+'  '+String(q.mood||'NEW').padEnd(7)+(ACC.name&&q.name.toLowerCase()===ACC.name.toLowerCase()?' < you':'')).join('\n'):'No ranked players yet. Be the first!'}
 catch(e){box.textContent=e.message}}
function accVictoryHud(){
 if(!NET.match){txt('UNRANKED MATCH · USE PLAY > RANKED MATCH FOR RATING',362,40,8,'#8a8a96');return}
 const r=ACC.res;if(!r)return;
 const t=r.state==='pending'?'RANKED · WAITING FOR RESULT…':r.state==='void'?'RANKED · RESULTS DISAGREED, NO CHANGE':r.state==='error'?'RANKED · '+r.msg:'RANKED · '+r.rating+'  ('+(r.delta>=0?'+':'')+r.delta+')';
 txt(t,362,30,8,r.state==='done'?(r.delta>=0?'#8fe08f':'#ff8a6a'):r.state==='error'?'#ff8a6a':'#ffd27a');
 if(r.state==='done'){
  const blink=Math.floor(performance.now()/350)%2===0;
  txt(r.up?'+'+r.xp+' XP · LEVEL UP! LV '+r.level:'+'+r.xp+' XP · LV '+r.level+' · '+r.mood,362,44,8,r.up?(blink?'#fff3c0':'#ffd27a'):'#cfd0d8')}}
// both players report who won; the server only changes ratings when the two reports agree (or one never arrives)
async function accReport(match,round,win){
 if(!match||!ACC.token)return;
 const mine={state:'pending',round};ACC.res=mine;let fails=0;
 for(let k=0;k<36&&ACC.res&&ACC.res.round===round&&ACC.res.state!=='done'&&ACC.res.state!=='void';k++){
  try{const j=await mmPost('/report',{token:ACC.token,match,round,win});fails=0;
   if(ACC.res.round!==round)return;
   if(j.done){
    if(j.void)ACC.res={state:'void',round};
    else{ACC.res={state:'done',round,win:j.win,delta:j.delta,rating:j.rating,xp:j.xp|0,level:j.level||ACC.level,up:!!j.up,mood:j.mood||'NEW'};ACC.rating=j.rating;ACC.level=j.level||ACC.level;ACC.xp=(ACC.xp|0)+(j.xp|0);ACC.mood=j.mood||ACC.mood;ACC.games++;if(j.win)ACC.wins++;else ACC.losses++;accSave()}
    accRefresh();return}
   ACC.res={state:'pending',round}}
  catch(e){
   if(e&&e.status===401){ACC.res={state:'error',round,msg:'SESSION EXPIRED · SIGN IN AGAIN'};return}
   if(e&&e.status&&e.status<500&&e.status!==429){ACC.res={state:'error',round,msg:'RESULT REJECTED · '+String(e.message||'').toUpperCase().slice(0,40)};return}
   if(++fails>=2&&ACC.res.round===round)ACC.res={state:'error',round,msg:'COULD NOT REACH SERVER · RETRYING'}}
  await new Promise(r=>setTimeout(r,k<2?2000:5000))}
 if(ACC.res&&ACC.res.round===round&&ACC.res.state==='pending')ACC.res={state:'error',round,msg:'NO RESULT YET · CHECK YOUR ACCOUNT LATER'}}

let last=performance.now(),acc=0;
function loop(now){
 const dt=Math.min(.1,(now-last)/1000);last=now;acc=paused?0:acc+dt*1000;
 let ticks=0;while(acc>=1000/60&&ticks<6){acc-=1000/60;ticks++;
  if(scene==='fight'&&!paused){
   if(mode===3){if(!netStep()){acc=Math.min(acc,1000/60);break}}else step(S,[read(0),mode===1?cpu(S,1):read(1)]);matchIntroFx();angelParticles();demonParticles();archerParticles();
   if(S.fc%2===0)S.p.forEach(q=>{if(q.rg>0&&q.rs<=0)spawnParticle({x:q.x+rand(-4,4),y:q.y-rand(0,14),vx:-q.f*20+rand(-10,10),vy:rand(-20,-5),life:.3,maxLife:.3,grav:-20,size:1,color:Math.random()<.5?'#ff4a2a':'#ffb347'})});
   if(S.fc%2===0)S.pr.filter(b=>!b.kn&&!b.fr&&!b.pel&&!b.sn&&!b.cat&&!b.sw&&!b.beam&&!b.imp&&!b.ar).forEach(b=>spawnParticle({x:b.x-b.f*3,y:b.y+rand(-2,2),vx:-b.f*30+rand(-15,15),vy:rand(-25,5),life:.3,maxLife:.3,grav:-30,size:b.big?2:1,color:Math.random()<.5?'#ff8a2a':'#ffd27a'}));
   if(S.fc%3===0)S.p.forEach(q=>{if(q.med>0&&q.rs<=0)spawnParticle({x:q.x+rand(-7,7),y:q.y-rand(0,4),vx:rand(-4,4),vy:rand(-30,-15),life:.6,maxLife:.6,grav:-10,size:1,color:'#ffe08a'})});
   if(S.fc%3===0)S.p.forEach(q=>{if(q.pw>0&&q.rs<=0)spawnParticle({x:q.x+rand(-6,6),y:q.y-rand(4,16),vx:rand(-6,6),vy:rand(-34,-18),life:.6,maxLife:.6,grav:-6,size:1,color:Math.random()<.5?'#ff7ad9':'#5fe0c0'})});
   if(S.fc%2===0)S.p.forEach(q=>{if(CH[q.ch].cb&&q.st>0&&q.rs<=0&&Math.random()<.25+.06*Math.min(q.st,10))spawnParticle({x:q.x+rand(-7,7),y:q.y-rand(2,18),vx:rand(-8,8),vy:rand(-52,-24),life:.7,maxLife:.7,grav:-10,size:1,color:Math.random()<.5?'#9adf4a':'#e8ff9a'})});
   if(S.fc%5===0)S.p.forEach(q=>{if(q.bl>0&&q.rs<=0)spawnParticle({x:q.x+rand(-3,3),y:q.y-rand(2,14),vx:rand(-6,6),vy:rand(0,10),life:.5,maxLife:.5,grav:120,size:1,color:'#b0182c'})});
   S.p.forEach(q=>{if(q.ws&&S.fc%3===0&&q.rs<=0)spawnParticle({x:q.x+q.wl*5,y:q.y-rand(2,16),vx:-q.wl*rand(2,10),vy:rand(-4,8),life:.25,maxLife:.25,grav:0,size:1,color:'#9a9cb0'})});
   S.p.forEach(q=>{if((q.dsh>0||q.chg>0)&&q.rs<=0)spawnParticle({x:q.x-q.f*rand(0,6),y:q.y-rand(2,14),vx:rand(-8,8),vy:rand(-8,8),life:.25,maxLife:.25,grav:0,size:2,color:q.chg>0?'#ffb347':'#9ad8b0'})});
   for(const f of S.fx.splice(0)){if(shakeOn)shake=Math.max(shake,Math.min(3,f.k*.25));
    for(let n=0;n<6+f.k;n++)spawnParticle({x:f.x,y:f.y,vx:rand(-90,90),vy:rand(-90,60),life:rand(.2,.45),maxLife:.45,grav:200,size:randi(1,2),color:f.h?(Math.random()<.5?'#ffffff':'#9fd8ff'):(Math.random()<.5?'#ffd27a':'#ff8a3d')})}
   if(S.phase==='over'&&scene==='fight')startVictory()}}
 if(mode===3&&NET.on&&scene!=='fight')netSendInputs();
 torchFlicker(dt);introUpdate(dt);vsUpdate(dt);if(scene==='victory')victoryT+=dt*1000;updateParticles(dt);shake*=.85;if(shake<.1)shake=0;
 render();requestAnimationFrame(loop)}

addEventListener('keydown',e=>{
 if(e.repeat||scene!=='victory'||victoryT<1800)return;
 if(!victoryMenu){vbSkip();e.preventDefault();return}
 if(e.code==='ArrowUp'||e.code==='KeyW'){victorySel=(victorySel+2)%3;e.preventDefault()}
 else if(e.code==='ArrowDown'||e.code==='KeyS'){victorySel=(victorySel+1)%3;e.preventDefault()}
 else if(e.code==='Enter'||e.code==='Space'||e.code==='KeyF'||e.code==='KeyK'){e.preventDefault();vbActivate(victorySel)}
});
canvas.addEventListener('mousedown',e=>{
 if(scene!=='victory'||victoryT<1800)return;
 if(!victoryMenu){vbSkip();return}
 const i=vbAt(e);if(i>=0)vbActivate(i)
});
canvas.addEventListener('mousemove',e=>{
 if(scene!=='victory'||!victoryMenu){canvas.style.cursor='';return}
 const i=vbAt(e);if(i>=0)victorySel=i;canvas.style.cursor=i>=0?'pointer':''
});

intro();requestAnimationFrame(loop);accRefresh();

})();
</script>
